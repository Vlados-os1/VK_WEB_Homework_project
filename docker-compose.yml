services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  web:
    build: .
    command: gunicorn -c askme_chukhvichev/wsgi_config.py askme_chukhvichev.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    networks:
      - app-network

  simple-wsgi:
    build: .
    command: gunicorn --bind 0.0.0.0:8081 --workers 2 simple_wsgi:application
    volumes:
      - .:/app
    ports:
      - "8081:8081"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
      - simple-wsgi
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  nginx_cache:

networks:
  app-network:
    driver: bridge