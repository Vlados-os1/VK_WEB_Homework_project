services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    volumes:
      - ./centrifugo_config.json:/centrifugo/config.json
    ports:
      - "8010:8010"
    networks:
      - app-network

  cron:
    build: .
    volumes:
      - .:/app
    networks:
      - app-network
    depends_on:
      - db
    command: >
      bash -c "
      echo '*/15 * * * * cd /app && python3 manage.py update_popular_tags >> /var/log/cron.log 2>&1' >> /etc/crontabs/root &&
      echo '*/15 * * * * cd /app && python3 manage.py update_best_members >> /var/log/cron.log 2>&1' >> /etc/crontabs/root &&
      crond -f"
    restart: unless-stopped

  web:
    build: .
    command: gunicorn -c askme_chukhvichev/wsgi_config.py askme_chukhvichev.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CENTRIFUGO_URL=http://centrifugo:8010
    depends_on:
      - db
      - centrifugo
    networks:
      - app-network

  simple-wsgi:
    build: .
    command: gunicorn --bind 0.0.0.0:8081 --workers 2 simple_wsgi:application
    volumes:
      - .:/app
    ports:
      - "8081:8081"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
      - simple-wsgi
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  nginx_cache:

networks:
  app-network:
    driver: bridge